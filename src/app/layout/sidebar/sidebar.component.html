<div class="brand">
  <span class="logo" aria-hidden="true">S</span>
  <span>Sys<b>DE</b></span>
</div>

<section class="org" aria-label="Organisation et profil">
  <div class="org-head">
    <strong>{{ currentUser.user().operator.acronym }}</strong>
    <span class="org-sub">{{ currentUser.sectorLabel() || currentUser.user().operator.name }}</span>
  </div>
  <div class="org-user">
    <span class="avatar avatar--round" aria-hidden="true">{{ currentUser.initials() }}</span>
    <span class="org-meta">
      <strong>{{ currentUser.fullName() }}</strong>
      <span class="org-sub">{{ currentUser.user().role }}</span>
    </span>
  </div>
</section>

<p class="eyebrow" id="nav-title">Menu</p>
<nav class="nav" aria-labelledby="nav-title">
  @for (item of items(); track item.path) {
    <a
      class="nav-item"
      [routerLink]="['/', item.path]"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      (click)="navigated.emit()"
    >
      <ui-icon [name]="item.icon" />
      {{ item.label }}
    </a>
  }
</nav>
