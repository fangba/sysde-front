<a class="skip-link" href="#contenu">Aller au contenu</a>

<header class="topbar">
  <div class="brand">
    <span class="logo" aria-hidden="true">S</span><span>Sys<b>DE</b></span>
  </div>
  <div class="topbar__actions">
    <sysde-notification-bell />
    <ui-theme-toggle />
    <sysde-user-menu />
    <button
      type="button"
      class="icon-btn"
      aria-label="Ouvrir le menu"
      aria-controls="sidebar"
      [attr.aria-expanded]="drawerOpen()"
      (click)="openDrawer()"
    >
      <ui-icon name="menu" />
    </button>
  </div>
</header>

<div class="scrim" [class.show]="drawerOpen()" aria-hidden="true" (click)="closeDrawer()"></div>

<aside
  id="sidebar"
  class="sidebar"
  [class.open]="drawerOpen()"
  [class.collapsed]="collapsed()"
  aria-label="Navigation principale"
>
  <sysde-sidebar
    [collapsed]="collapsed()"
    (navigated)="closeDrawer()"
    (toggled)="toggleCollapsed()"
  />
</aside>

<main id="contenu" class="main" tabindex="-1">
  <div class="toolbar" role="toolbar" aria-label="Barre d'outils">
    <div class="toolbar__inner">
      <sysde-notification-bell />
      <ui-theme-toggle />
      <sysde-user-menu />
    </div>
  </div>
  <div class="main__inner">
    <router-outlet />
  </div>
</main>
