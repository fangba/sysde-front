<ui-page-header title="Plantations" [subtitle]="subtitle()">
  @if (store.operators().length > 1) {
    <ui-period-select
      label="Opérateur"
      [options]="operatorOptions()"
      [value]="operator()"
      (valueChange)="chooseOperator($event)"
    />
  }
  @if (sectorOptions().length > 2) {
    <ui-period-select
      label="Secteur"
      [options]="sectorOptions()"
      [value]="sector()"
      (valueChange)="sector.set($event)"
    />
  }
</ui-page-header>

<section class="stats" aria-label="Synthèse des plantations">
  @for (stat of stats(); track stat.label) {
    <div class="stat">
      <span class="stat__label">{{ stat.label }}</span>
      <strong class="stat__value">{{ stat.value }}</strong>
    </div>
  }
</section>

<ui-card heading="Liste des plantations" [subheading]="count()">
  <ui-data-table
    [columns]="columns()"
    [columnFilters]="true"
    [rows]="rows()"
    caption="Liste des plantations"
    [rowLabel]="rowLabel"
    [loading]="store.loading()"
    [editLabel]="store.canAssign() ? 'Affecter' : 'Consulter'"
    [editIcon]="store.canAssign() ? 'edit' : 'eye'"
    searchPlaceholder="Rechercher un planteur, un code, un village…"
    emptyTitle="Aucune plantation"
    [emptyDescription]="
      store.failed()
        ? 'La base des plantations est injoignable pour le moment.'
        : 'Aucune plantation ne correspond à ce périmètre.'
    "
    (rowEdit)="open($event)"
  >
    @if (store.canAssign()) {
      <div tableActions class="table-actions">
        <button
          ui-button
          variant="secondary"
          type="button"
          [loading]="downloading()"
          (click)="downloadTemplate()"
        >
          <ui-icon name="download" /> Modèle Excel
        </button>
        <button
          ui-button
          variant="primary"
          type="button"
          [disabled]="store.saving() || store.loading()"
          (click)="file.click()"
        >
          <ui-icon name="upload" /> Importer des affectations
        </button>
        <input
          #file
          type="file"
          class="file"
          accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
          aria-label="Choisir un fichier Excel d'affectations"
          tabindex="-1"
          (change)="onFile($event)"
        />
      </div>
    }
  </ui-data-table>
</ui-card>
